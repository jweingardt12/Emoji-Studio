<!DOCTYPE html>
<html>
<head>
  <title>Frame Delay Test (Local)</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .test { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
    img { max-width: 300px; }
    canvas { border: 1px solid #999; background: #f0f0f0; }
    #error { color: red; }
  </style>
</head>
<body>
  <h1>GIF Frame Delay Test (Local Version)</h1>
  
  <div class="test">
    <h2>Load a GIF to test:</h2>
    <input type="file" id="fileInput" accept="image/gif">
    <div id="error"></div>
  </div>

  <div class="test" id="results" style="display: none;">
    <h2>Original GIF:</h2>
    <img id="originalImg" alt="Original">
    
    <h2>Test Canvas Animation:</h2>
    <canvas id="testCanvas" width="498" height="344"></canvas>
    <div>
      <label>Speed: <span id="speedValue">1</span>x</label>
      <input type="range" id="speedSlider" min="0.5" max="15" step="0.5" value="1">
    </div>
    <div id="info"></div>
    <div id="debug"></div>
  </div>

  <script>
    // Load the Tenor test GIF URL for quick testing
    const tenorTestUrl = 'https://media1.tenor.com/m/3l4Ky00EA8IAAAAd/liam-neeson-i-will-find-you.gif';
    
    let animationTimeout = null;
    let currentFrame = 0;
    let frames = [];
    let speed = 1;
    let canvas, ctx;
    
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !file.type.includes('gif')) {
        document.getElementById('error').textContent = 'Please select a GIF file';
        return;
      }
      
      document.getElementById('error').textContent = '';
      document.getElementById('results').style.display = 'block';
      
      // Show original
      const url = URL.createObjectURL(file);
      document.getElementById('originalImg').src = url;
      
      // Load and parse GIF
      await loadGif(file);
    });
    
    async function loadGif(file) {
      try {
        // Simple frame extraction using canvas
        const img = new Image();
        const url = URL.createObjectURL(file);
        
        img.onload = async () => {
          canvas = document.getElementById('testCanvas');
          ctx = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;
          
          // For testing, we'll just animate the image directly
          // This won't extract individual frames but will show the animation
          const info = document.getElementById('info');
          info.innerHTML = `
            <p>Image size: ${img.width}x${img.height}</p>
            <p>File size: ${(file.size / 1024).toFixed(1)}KB</p>
            <p>Note: This simple version animates the whole GIF, not individual frames</p>
          `;
          
          // Setup slider
          const slider = document.getElementById('speedSlider');
          const speedValue = document.getElementById('speedValue');
          
          slider.addEventListener('input', (e) => {
            speed = parseFloat(e.target.value);
            speedValue.textContent = speed.toFixed(1);
          });
          
          // Create an animated version
          animateGif(img);
          
          URL.revokeObjectURL(url);
        };
        
        img.onerror = () => {
          document.getElementById('error').textContent = 'Failed to load GIF';
          URL.revokeObjectURL(url);
        };
        
        img.src = url;
        
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('error').textContent = 'Error: ' + error.message;
      }
    }
    
    function animateGif(img) {
      // For a simple test, we'll just redraw the image
      // The browser will handle the GIF animation internally
      let frameCount = 0;
      
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        
        frameCount++;
        
        // Base delay of 100ms (10fps) like Tenor GIFs
        const baseDelay = 100;
        const adjustedDelay = Math.max(20, Math.round(baseDelay / speed));
        
        // Update debug info
        document.getElementById('debug').innerHTML = `
          Draw calls: ${frameCount} | 
          Base: ${baseDelay}ms | 
          Speed: ${speed}x | 
          Adjusted: ${adjustedDelay}ms |
          Target FPS: ${Math.round(1000/adjustedDelay)}
        `;
        
        animationTimeout = setTimeout(draw, adjustedDelay);
      }
      
      draw();
    }
    
    // Add a quick test button for the Tenor URL
    const quickTestBtn = document.createElement('button');
    quickTestBtn.textContent = 'Quick Test with Tenor GIF';
    quickTestBtn.style.marginLeft = '10px';
    quickTestBtn.onclick = async () => {
      try {
        // Try to fetch through proxy
        const response = await fetch('https://corsproxy.io/?' + encodeURIComponent(tenorTestUrl));
        const blob = await response.blob();
        const file = new File([blob], 'tenor-test.gif', { type: 'image/gif' });
        
        document.getElementById('results').style.display = 'block';
        document.getElementById('originalImg').src = tenorTestUrl;
        
        await loadGif(file);
      } catch (error) {
        // If proxy fails, at least show the original
        document.getElementById('results').style.display = 'block';
        document.getElementById('originalImg').src = tenorTestUrl;
        document.getElementById('error').textContent = 'Could not load through proxy, showing original only';
      }
    };
    document.querySelector('.test').appendChild(quickTestBtn);
  </script>
</body>
</html>
