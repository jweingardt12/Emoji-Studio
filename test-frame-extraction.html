<!DOCTYPE html>
<html>
<head>
  <title>GIF Frame Extraction Test</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .test { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
    img, canvas { max-width: 300px; border: 1px solid #999; margin: 5px; }
    #frames { display: flex; flex-wrap: wrap; gap: 10px; }
    .frame-item { 
      border: 1px solid #ddd; 
      padding: 5px; 
      text-align: center;
      background: #f9f9f9;
    }
    .frame-item canvas { display: block; margin: 0 auto; }
    .frame-info { font-size: 11px; margin-top: 5px; }
    #error { color: red; }
    #loading { display: none; }
    .controls { margin: 20px 0; }
  </style>
</head>
<body>
  <h1>GIF Frame Extraction Test</h1>
  
  <div class="test">
    <h2>Load a GIF file:</h2>
    <input type="file" id="fileInput" accept="image/gif">
    <button id="loadTenor">Load Tenor Test GIF</button>
    <div id="error"></div>
    <div id="loading">Loading and extracting frames...</div>
  </div>

  <div class="test" id="results" style="display: none;">
    <h2>Original GIF:</h2>
    <img id="originalImg" alt="Original">
    
    <div class="controls">
      <h2>Animated Preview:</h2>
      <canvas id="animCanvas"></canvas>
      <div>
        <label>Speed: <span id="speedValue">1</span>x</label>
        <input type="range" id="speedSlider" min="0.5" max="10" step="0.5" value="1">
        <button id="playBtn">Play</button>
        <button id="stopBtn">Stop</button>
      </div>
      <div id="animInfo"></div>
    </div>
    
    <h2>Extracted Frames:</h2>
    <div id="frameInfo"></div>
    <div id="frames"></div>
  </div>

  <script type="module">
    // Import the actual extractor from your app
    import { GifFrameExtractor } from './lib/utils/gif-frame-extractor.js';
    
    let frames = [];
    let animationTimeout = null;
    let currentFrame = 0;
    let isPlaying = false;
    let speed = 1;
    
    const fileInput = document.getElementById('fileInput');
    const loadTenorBtn = document.getElementById('loadTenor');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !file.type.includes('gif')) {
        showError('Please select a GIF file');
        return;
      }
      await processGif(file);
    });
    
    loadTenorBtn.addEventListener('click', async () => {
      try {
        document.getElementById('loading').style.display = 'block';
        const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://media1.tenor.com/m/3l4Ky00EA8IAAAAd/liam-neeson-i-will-find-you.gif'));
        const blob = await response.blob();
        const file = new File([blob], 'tenor-test.gif', { type: 'image/gif' });
        await processGif(file);
      } catch (error) {
        showError('Failed to load Tenor GIF: ' + error.message);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    });
    
    playBtn.addEventListener('click', startAnimation);
    stopBtn.addEventListener('click', stopAnimation);
    
    speedSlider.addEventListener('input', (e) => {
      speed = parseFloat(e.target.value);
      speedValue.textContent = speed.toFixed(1);
      if (isPlaying) {
        stopAnimation();
        startAnimation();
      }
    });
    
    async function processGif(file) {
      try {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('error').textContent = '';
        
        // Show original
        const url = URL.createObjectURL(file);
        document.getElementById('originalImg').src = url;
        
        // Extract frames
        frames = await GifFrameExtractor.extractFrames(file, (progress, message) => {
          console.log(`Progress: ${progress}% - ${message}`);
        });
        
        console.log(`Extracted ${frames.length} frames`);
        
        // Display results
        displayFrames();
        document.getElementById('results').style.display = 'block';
        
        URL.revokeObjectURL(url);
      } catch (error) {
        showError('Error extracting frames: ' + error.message);
        console.error('Extraction error:', error);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }
    
    function displayFrames() {
      const framesContainer = document.getElementById('frames');
      const frameInfo = document.getElementById('frameInfo');
      
      // Clear previous frames
      framesContainer.innerHTML = '';
      
      // Show frame info
      const delays = frames.map(f => f.delay);
      const avgDelay = delays.reduce((a, b) => a + b, 0) / delays.length;
      
      frameInfo.innerHTML = `
        <p>Total frames: ${frames.length}</p>
        <p>Average delay: ${avgDelay.toFixed(1)}ms (${(1000/avgDelay).toFixed(1)} fps)</p>
        <p>Min delay: ${Math.min(...delays)}ms, Max delay: ${Math.max(...delays)}ms</p>
      `;
      
      // Display first 10 frames as samples
      const samplesToShow = Math.min(10, frames.length);
      for (let i = 0; i < samplesToShow; i++) {
        const frame = frames[i];
        const frameDiv = document.createElement('div');
        frameDiv.className = 'frame-item';
        
        const canvas = document.createElement('canvas');
        canvas.width = Math.min(100, frame.data.width);
        canvas.height = Math.min(100, frame.data.height);
        
        const ctx = canvas.getContext('2d');
        
        // Scale the frame to fit
        const scale = Math.min(100 / frame.data.width, 100 / frame.data.height);
        const scaledWidth = frame.data.width * scale;
        const scaledHeight = frame.data.height * scale;
        
        // Create temp canvas for the frame
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = frame.data.width;
        tempCanvas.height = frame.data.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.putImageData(frame.data, 0, 0);
        
        // Draw scaled
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(tempCanvas, 
          (canvas.width - scaledWidth) / 2, 
          (canvas.height - scaledHeight) / 2, 
          scaledWidth, 
          scaledHeight
        );
        
        frameDiv.appendChild(canvas);
        
        const info = document.createElement('div');
        info.className = 'frame-info';
        info.innerHTML = `Frame ${i + 1}<br>${frame.delay}ms`;
        frameDiv.appendChild(info);
        
        framesContainer.appendChild(frameDiv);
      }
      
      if (frames.length > samplesToShow) {
        const moreDiv = document.createElement('div');
        moreDiv.style.padding = '20px';
        moreDiv.innerHTML = `<em>... and ${frames.length - samplesToShow} more frames</em>`;
        framesContainer.appendChild(moreDiv);
      }
      
      // Setup animation canvas
      if (frames.length > 0) {
        const animCanvas = document.getElementById('animCanvas');
        animCanvas.width = frames[0].data.width;
        animCanvas.height = frames[0].data.height;
      }
    }
    
    function startAnimation() {
      if (frames.length === 0) return;
      
      isPlaying = true;
      currentFrame = 0;
      
      const animCanvas = document.getElementById('animCanvas');
      const ctx = animCanvas.getContext('2d');
      
      function animate() {
        if (!isPlaying) return;
        
        const frame = frames[currentFrame];
        
        // Clear and draw frame
        ctx.clearRect(0, 0, animCanvas.width, animCanvas.height);
        ctx.putImageData(frame.data, 0, 0);
        
        // Calculate delay
        const baseDelay = frame.delay;
        const adjustedDelay = Math.max(20, Math.round(baseDelay / speed));
        
        // Update info
        document.getElementById('animInfo').innerHTML = `
          Frame ${currentFrame + 1}/${frames.length} | 
          Delay: ${baseDelay}ms → ${adjustedDelay}ms | 
          FPS: ${Math.round(1000/adjustedDelay)}
        `;
        
        // Next frame
        currentFrame = (currentFrame + 1) % frames.length;
        
        animationTimeout = setTimeout(animate, adjustedDelay);
      }
      
      animate();
    }
    
    function stopAnimation() {
      isPlaying = false;
      if (animationTimeout) {
        clearTimeout(animationTimeout);
        animationTimeout = null;
      }
    }
    
    function showError(message) {
      document.getElementById('error').textContent = message;
    }
  </script>
</body>
</html>
