<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Studio - App Icon Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        h1 {
            color: white;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 800px;
        }
        
        .icon-preview {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .icon-wrapper {
            display: inline-block;
            border-radius: 22.2%;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        
        .icon-wrapper:hover {
            transform: scale(1.05);
        }
        
        .icon {
            display: block;
            width: 100%;
            height: auto;
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 50%, #0f0f0f 100%);
        }
        
        .size-label {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }
        
        .emoji-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50%;
            position: relative;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 50%, #0f0f0f 100%);
            border-radius: 22.2%;
            position: relative;
            overflow: hidden;
        }
        
        .gradient-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.08), transparent);
            pointer-events: none;
        }
        
        .gradient-bg::after {
            content: '😊';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 45%;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
    </style>
</head>
<body>
    <h1>Emoji Studio App Icon Preview</h1>
    
    <div class="preview-container">
        <div class="icon-preview">
            <div class="icon-wrapper">
                <div class="gradient-bg" style="width: 180px; height: 180px;"></div>
            </div>
            <div class="size-label">iOS (180×180)</div>
        </div>
        
        <div class="icon-preview">
            <div class="icon-wrapper">
                <div class="gradient-bg" style="width: 120px; height: 120px;"></div>
            </div>
            <div class="size-label">iPhone (120×120)</div>
        </div>
        
        <div class="icon-preview">
            <div class="icon-wrapper">
                <div class="gradient-bg" style="width: 192px; height: 192px;"></div>
            </div>
            <div class="size-label">Android (192×192)</div>
        </div>
        
        <div class="icon-preview">
            <div class="icon-wrapper">
                <div class="gradient-bg" style="width: 96px; height: 96px;"></div>
            </div>
            <div class="size-label">Small (96×96)</div>
        </div>
    </div>
    
    <p style="color: white; margin-top: 40px; text-align: center;">
        Modern SaaS-style app icon with subtle gradient background<br>
        Emoji is 45% of icon size for better visual balance
    </p>
</body>
</html>
