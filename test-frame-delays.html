<!DOCTYPE html>
<html>
<head>
  <title>Frame Delay Test</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .test { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
    img { max-width: 300px; }
    canvas { border: 1px solid #999; }
  </style>
</head>
<body>
  <h1>GIF Frame Delay Test</h1>
  
  <div class="test">
    <h2>Original Tenor GIF:</h2>
    <img src="https://media1.tenor.com/m/3l4Ky00EA8IAAAAd/liam-neeson-i-will-find-you.gif" alt="Original">
    <p>This is how fast the GIF should play at 1x speed</p>
  </div>

  <div class="test">
    <h2>Test Canvas Animation:</h2>
    <canvas id="testCanvas" width="498" height="344"></canvas>
    <div>
      <label>Speed: <span id="speedValue">1</span>x</label>
      <input type="range" id="speedSlider" min="0.5" max="15" step="0.5" value="1">
    </div>
    <div id="info"></div>
    <div id="debug"></div>
  </div>

  <script type="module">
    import { parseGIF, decompressFrames } from 'https://unpkg.com/gifuct-js@2.1.2/dist/gifuct-js.esm.js'
    
    let animationTimeout = null
    let currentFrame = 0
    let frames = []
    let speed = 1
    let canvas, ctx
    let compositeCanvas, compositeCtx
    let previousImageData = null
    
    async function loadGif() {
      try {
        // Fetch through proxy
        console.log('Fetching GIF...')
        const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://media1.tenor.com/m/3l4Ky00EA8IAAAAd/liam-neeson-i-will-find-you.gif'))
        if (!response.ok) throw new Error('Failed to fetch')
        
        const buffer = await response.arrayBuffer()
        console.log('Parsing GIF...')
        
        const gif = parseGIF(buffer)
        frames = decompressFrames(gif, true)
        
        console.log('GIF info:', gif)
        console.log('Frames:', frames.length)
        console.log('Frame delays (centiseconds):', frames.map(f => f.delay))
        console.log('Frame delays (milliseconds):', frames.map(f => f.delay * 10))
        
        const info = document.getElementById('info')
        info.innerHTML = `
          <p>Frames: ${frames.length}</p>
          <p>Delays (ms): ${frames.map(f => f.delay * 10).join(', ')}</p>
          <p>Average delay: ${frames.reduce((a, f) => a + f.delay * 10, 0) / frames.length}ms</p>
        `
        
        // Setup display canvas
        canvas = document.getElementById('testCanvas')
        ctx = canvas.getContext('2d')
        canvas.width = gif.lsd.width
        canvas.height = gif.lsd.height
        
        // Setup composite canvas for proper frame disposal
        compositeCanvas = document.createElement('canvas')
        compositeCanvas.width = gif.lsd.width
        compositeCanvas.height = gif.lsd.height
        compositeCtx = compositeCanvas.getContext('2d')
        
        // Setup slider
        const slider = document.getElementById('speedSlider')
        const speedValue = document.getElementById('speedValue')
        
        slider.addEventListener('input', (e) => {
          speed = parseFloat(e.target.value)
          speedValue.textContent = speed.toFixed(1)
          console.log('Speed changed to:', speed)
          
          // Don't restart animation, just update the speed
          // The next frame will use the new speed automatically
        })
        
        // Start animation
        console.log('Starting animation...')
        animate()
        
      } catch (error) {
        console.error('Error:', error)
        document.getElementById('debug').innerHTML = `<p style="color:red">Error: ${error.message}</p>`
      }
    }
    
    function animate() {
      if (!frames || frames.length === 0) return
      
      const frame = frames[currentFrame]
      
      // Log first frame details for debugging
      if (currentFrame === 0) {
        console.log('Drawing frame 0:', {
          dims: frame.dims,
          patchLength: frame.patch ? frame.patch.length : 0,
          disposalType: frame.disposalType,
          delay: frame.delay
        })
      }
      
      // Handle disposal from previous frame
      if (currentFrame > 0) {
        const prevFrame = frames[currentFrame - 1]
        if (prevFrame.disposalType === 2) {
          // Clear to background
          compositeCtx.clearRect(0, 0, compositeCanvas.width, compositeCanvas.height)
        } else if (prevFrame.disposalType === 3 && previousImageData) {
          // Restore to previous
          compositeCtx.putImageData(previousImageData, 0, 0)
        }
        // disposalType 0 or 1: don't dispose, leave canvas as is
      } else {
        // First frame - clear canvas
        compositeCtx.clearRect(0, 0, compositeCanvas.width, compositeCanvas.height)
      }
      
      // Save state before drawing if next frame needs it
      if (frame.disposalType === 3) {
        previousImageData = compositeCtx.getImageData(0, 0, compositeCanvas.width, compositeCanvas.height)
      }
      
      // Draw current frame patch to composite
      try {
        if (!frame.patch || frame.patch.length === 0) {
          console.error('Frame has no patch data:', currentFrame)
          return
        }
        
        // Create ImageData from frame patch
        const patchData = new ImageData(
          new Uint8ClampedArray(frame.patch),
          frame.dims.width,
          frame.dims.height
        )
        
        // Use temporary canvas to draw patch
        const tempCanvas = document.createElement('canvas')
        tempCanvas.width = frame.dims.width
        tempCanvas.height = frame.dims.height
        const tempCtx = tempCanvas.getContext('2d')
        
        if (!tempCtx) {
          console.error('Failed to get context for temp canvas')
          return
        }
        
        tempCtx.putImageData(patchData, 0, 0)
        
        // Draw patch at correct position on composite canvas
        compositeCtx.drawImage(tempCanvas, frame.dims.left || 0, frame.dims.top || 0)
        
        // Copy composite to display canvas with a background to see if anything is drawn
        ctx.fillStyle = '#ffffff'
        ctx.fillRect(0, 0, canvas.width, canvas.height)
        ctx.drawImage(compositeCanvas, 0, 0)
        
      } catch (e) {
        console.error('Draw error:', e, 'Frame:', currentFrame)
      }
      
      // Calculate next frame delay
      const baseDelay = frame.delay * 10 // Convert centiseconds to milliseconds
      const adjustedDelay = Math.max(20, Math.round(baseDelay / speed))
      
      // Update debug info
      document.getElementById('debug').innerHTML = `
        Frame ${currentFrame + 1}/${frames.length} | 
        Base: ${baseDelay}ms | 
        Speed: ${speed}x | 
        Adjusted: ${adjustedDelay}ms |
        FPS: ${Math.round(1000/adjustedDelay)}
      `
      
      // Move to next frame
      currentFrame = (currentFrame + 1) % frames.length
      
      // Schedule next frame
      animationTimeout = setTimeout(() => animate(), adjustedDelay)
    }
    
    // Start loading
    loadGif()
  </script>
</body>
</html>
